name: Node.js CI - WeatherSphere

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: 🏗️ Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🧪 Run tests
      run: node test.js

    - name: ✅ Lint check
      run: |
        echo "Checking basic syntax..."
        node -c test.js
        echo "✅ All files syntax is valid!"

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'

    - name: 📦 Install dependencies
      run: npm install

    - name: 🔍 Run security audit
      run: |
        echo "Running security checks..."
        npm audit --audit-level moderate || true
        echo "✅ Security audit completed"